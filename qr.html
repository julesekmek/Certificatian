<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR code — Certificat Persona 2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1B2E;font-family:system-ui,sans-serif;color:#fff;text-align:center}
#qr{background:#fff;padding:28px;border-radius:24px;display:inline-block}p{margin-top:22px;font-size:18px;opacity:.85}</style></head>
<body><div><div id="qr"></div><p id="u"></p><p style="font-size:14px;opacity:.6">Faites une capture d'écran de ce QR code pour la slide de la présentation.</p></div>
<script>const url=location.origin+"/";document.getElementById("u").textContent=url;
new QRCode(document.getElementById("qr"),{text:url,width:420,height:420,colorDark:"#0E1B2E",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});</script></body></html>
